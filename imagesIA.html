<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #4B0082, #8A2BE2, #DA70D6);
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .img-destaque {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .img-destaque:hover {
            transform: scale(1.02);
        }

        .div-images {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .img-pequena {
            width: 30%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .img-pequena:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <img class="img-destaque" src="F1.jpg" alt="Imagem destaque">

    <div class="div-images">
        <img class="img-pequena" src="F2.webp" alt="Imagem 2">
        <img class="img-pequena" src="F3.jpeg" alt="Imagem 3">
        <img class="img-pequena" src="F4.jpg" alt="Imagem 4">
    </div>

</body>

</html>
