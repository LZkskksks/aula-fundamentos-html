<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            min-height: 100vh;
            padding: 30px;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: auto;
        }

        /* ===== TÍTULO ===== */
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }

        /* ===== TODAS AS IMAGENS ===== */
        img {
            width: 100%;
            display: block;
            border-radius: 20px;
            object-fit: cover;
            transition: .3s ease;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,.3);
        }

        img:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 20px rgba(0,0,0,.4);
        }

        /* ===== IMAGEM PRINCIPAL ===== */
        .img-destaque {
            height: 500px;
            margin-bottom: 25px;
        }

        /* ===== GALERIA ===== */
        .galeria {
            display: flex;
            gap: 20px;
        }

        .galeria img {
            height: 250px;
            flex: 1;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .img-destaque {
                height: 300px;
            }

            .galeria {
                flex-direction: column;
            }

            .galeria img {
                height: 220px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {

            .img-destaque {
                height: 220px;
            }

            .galeria img {
                height: 180px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Galeria de Imagens</h1>

        <!-- Imagem principal -->
        <img
            class="img-destaque"
            src="aula-fundamentos-html/F1.jpg"
            alt="Imagem principal">

        <!-- Galeria -->
        <div class="galeria">

            <img
                src="aula-fundamentos-html/F2.webp"
                alt="Primeira imagem">

            <img
                src="aula-fundamentos-html/F3.jpeg"
                alt="Segunda imagem">

            <img
                src="aula-fundamentos-html/F4.jpg"
                alt="Terceira imagem">

        </div>

    </div>

</body>

</html>
